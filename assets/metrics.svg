<svg xmlns="http://www.w3.org/2000/svg" width="900" height="160" viewBox="0 0 900 160">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="900" height="160" rx="18" fill="url(#card)" stroke="#1F2937"/>
  <!-- card 1 -->
  <rect x="24" y="28" width="200" height="104" rx="14" fill="#070B14" stroke="#2DD4BF" stroke-opacity="0.45"/>
  <text x="124" y="70" text-anchor="middle" fill="#2DD4BF" font-family="Segoe UI, Arial" font-size="13" letter-spacing="2">PIPELINE</text>
  <text x="124" y="104" text-anchor="middle" fill="#F9FAFB" font-family="Segoe UI, Arial" font-size="26" font-weight="700">45m ’ 2m</text>
  <!-- card 2 -->
  <rect x="240" y="28" width="200" height="104" rx="14" fill="#070B14" stroke="#F59E0B" stroke-opacity="0.55"/>
  <text x="340" y="70" text-anchor="middle" fill="#F59E0B" font-family="Segoe UI, Arial" font-size="13" letter-spacing="2">CAMPAIGNS</text>
  <text x="340" y="104" text-anchor="middle" fill="#F9FAFB" font-family="Segoe UI, Arial" font-size="26" font-weight="700">20M+ SMS</text>
  <!-- card 3 -->
  <rect x="456" y="28" width="200" height="104" rx="14" fill="#070B14" stroke="#6366F1" stroke-opacity="0.55"/>
  <text x="556" y="70" text-anchor="middle" fill="#A5B4FC" font-family="Segoe UI, Arial" font-size="13" letter-spacing="2">EXPERIENCE</text>
  <text x="556" y="104" text-anchor="middle" fill="#F9FAFB" font-family="Segoe UI, Arial" font-size="26" font-weight="700">~5 years</text>
  <!-- card 4 -->
  <rect x="672" y="28" width="200" height="104" rx="14" fill="#070B14" stroke="#14B8A6" stroke-opacity="0.55"/>
  <text x="772" y="70" text-anchor="middle" fill="#5EEAD4" font-family="Segoe UI, Arial" font-size="13" letter-spacing="2">ECPC</text>
  <text x="772" y="104" text-anchor="middle" fill="#F9FAFB" font-family="Segoe UI, Arial" font-size="26" font-weight="700">Finals ×3</text>
</svg>
